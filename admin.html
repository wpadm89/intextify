<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intextify | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--bg-primary); }
        .admin-panel { background: var(--bg-secondary); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-header { text-align: center; margin-bottom: 2rem; }
        .admin-header h1 { color: #00E5FF; }
        .form-group { margin-bottom: 1rem; }
        .action-btn { width: 100%; margin-top: 1rem; }
        #rates-editor { display: none; }
    </style>
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="nttKcMMSvpiE9XgFKECdY4J80taaKOKwkm0oxHekwjQ" />
    <!-- Google Analytics Tracking -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XTMXVQ4QKE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XTMXVQ4QKE');
    </script>
</head>
<body>

<div class="admin-panel" id="auth-section">
    <div class="admin-header">
        <h1>Admin Access</h1>
        <p class="subtitle text-[var(--text-secondary)]">Enter master key to access live rates overrides</p>
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="admin-pass" placeholder="Enter password" aria-label="Enter password">
    </div>
    <button class="action-btn primary-btn" id="btn-login">Login</button>
</div>

<div class="admin-panel" id="rates-editor">
    <div class="admin-header">
        <h1>Live Rates Override</h1>
        <p class="subtitle text-[var(--text-secondary)]">Manually fix rates if the scraper fails.</p>
    </div>
    
    <div id="overrides-container">
        <!-- JS Injected -->
    </div>

    <button class="action-btn primary-btn" id="btn-save-overrides">Save Overrides</button>
    <p id="status-msg" class="text-center mt-4 text-[#10b981]" style="display:none;"></p>
</div>

<script>
    const passwordInput = document.getElementById('admin-pass');
    let currentPassword = '';
    
    document.getElementById('btn-login').addEventListener('click', async () => {
        currentPassword = passwordInput.value;
        if (!currentPassword) return;

        // Fetch current overrides to populate inputs
        try {
            const res = await fetch('/api/rates');
            const data = await res.json();
            
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('rates-editor').style.display = 'block';
            
            // Save admin key to localStorage so the guest-posts section can load
            localStorage.setItem('adminKey', currentPassword);

            const container = document.getElementById('overrides-container');
            const materials = ['bricks', 'cement', 'sand', 'crush', 'steel', 'labor'];
            
            materials.forEach(mat => {
                const group = document.createElement('div');
                group.className = 'form-group';
                
                const baseVal = data.baseRates[mat] || 0;
                const overrideVal = data.overrides[mat] !== undefined ? data.overrides[mat] : '';
                
                group.innerHTML = `
                    <label class="capitalize">${mat} (Base: ${baseVal})</label>
                    <input type="number" data-mat="${mat}" placeholder="Leave blank to use base rate" value="${overrideVal}" aria-label="${mat} override">
                `;
                container.appendChild(group);
            });
        } catch(e) {
            alert('Could not fetch rates. Is server running?');
        }
    });

    document.getElementById('btn-save-overrides').addEventListener('click', async () => {
        const inputs = document.querySelectorAll('#overrides-container input');
        const overrides = {};
        
        inputs.forEach(inp => {
            const val = inp.value;
            if (val && !isNaN(val)) {
                overrides[inp.getAttribute('data-mat')] = parseFloat(val);
            }
        });

        try {
            const res = await fetch('/api/rates/override', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: currentPassword, overrides })
            });

            const result = await res.json();
            if (res.ok) {
                const msg = document.getElementById('status-msg');
                msg.innerText = result.message;
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);
            } else {
                alert(result.error);
            }
        } catch(e) {
            alert('Failed to save.');
        }
    }); 
</script>
<!-- Guest Posts Review Section -->
<section id="guest-posts-section" class="mt-10" style="display:none;">
  <h2 class="text-2xl font-bold mb-6 text-[var(--primary)]">
    📝 Guest Post Submissions
  </h2>

  <!-- Filter Tabs -->
  <div class="flex gap-2 mb-6">
    <button onclick="filterPosts('pending')" id="tab-pending"
      class="px-4 py-2 rounded-lg text-sm font-semibold bg-yellow-100 
             text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200 
             border-2 border-yellow-400">
      ⏳ Pending
    </button>
    <button onclick="filterPosts('approved')" id="tab-approved"
      class="px-4 py-2 rounded-lg text-sm font-semibold bg-gray-100 
             text-gray-600 dark:bg-gray-800 dark:text-gray-400 
             border-2 border-transparent">
      ✅ Approved
    </button>
    <button onclick="filterPosts('rejected')" id="tab-rejected"
      class="px-4 py-2 rounded-lg text-sm font-semibold bg-gray-100 
             text-gray-600 dark:bg-gray-800 dark:text-gray-400 
             border-2 border-transparent">
      ❌ Rejected
    </button>
  </div>

  <!-- Posts Container -->
  <div id="guest-posts-container">
    <p class="text-gray-400 text-sm">Loading submissions...</p>
  </div>
</section>

<script>
  let allGuestPosts  = [];
  let currentFilter  = 'pending';

  // ── Fetch Posts ───────────────────────────────────────────────
  async function loadGuestPosts() {
    const container = document.getElementById('guest-posts-container');
    const section = document.getElementById('guest-posts-section');

    // Get admin key from localStorage (set by existing admin login logic)
    const adminKey = localStorage.getItem('adminKey');

    // If not authenticated yet, hide section entirely and retry after 1 second
    if (!adminKey) {
      if (section) section.style.display = 'none';
      setTimeout(loadGuestPosts, 1000);
      return;
    }

    // Key exists — show section and fetch
    if (section) section.style.display = 'block';

    try {
      const res = await fetch('/api/guest-posts', {
        headers: { 'Authorization': `Bearer ${adminKey}` }
      });

      if (res.status === 401) {
        localStorage.removeItem('adminKey');
        if (section) section.style.display = 'none';
        container.innerHTML =
          '<p class="text-red-500 font-semibold">❌ Unauthorized. Wrong password.</p>';
        return;
      }

      const data = await res.json();
      allGuestPosts = data.posts || [];
      renderPosts(currentFilter);

    } catch (err) {
      container.innerHTML =
        '<p class="text-red-500">Failed to load posts. Check your connection.</p>';
    }
  }

  // ── Filter Tabs ───────────────────────────────────────────────
  function filterPosts(status) {
    currentFilter = status;

    // Update tab styles
    ['pending', 'approved', 'rejected'].forEach(s => {
      const tab = document.getElementById(`tab-${s}`);
      const isActive = s === status;
      tab.className = isActive
        ? 'px-4 py-2 rounded-lg text-sm font-semibold border-2 ' +
          (s === 'pending'  ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200 border-yellow-400' :
           s === 'approved' ? 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200 border-green-400' :
                              'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200 border-red-400')
        : 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400 border-2 border-transparent';
    });

    renderPosts(status);
  }

  // ── Render Posts ──────────────────────────────────────────────
  function renderPosts(status) {
    const container = document.getElementById('guest-posts-container');
    const filtered  = allGuestPosts.filter(p => p.status === status);

    if (filtered.length === 0) {
      container.innerHTML = 
        `<p class="text-gray-400 text-sm">No ${status} submissions found.</p>`;
      return;
    }

    container.innerHTML = filtered.map(post => `
      <div class="border border-gray-200 dark:border-gray-700 rounded-xl 
                  p-5 mb-4 bg-white dark:bg-gray-900 shadow-sm">

        <!-- Post Header -->
        <div class="flex flex-wrap justify-between items-start gap-2 mb-3">
          <div>
            <h3 class="font-bold text-lg text-[var(--primary)]">
              ${escapeHtml(post.title)}
            </h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
              👤 ${escapeHtml(post.name)} &nbsp;|&nbsp;
              ✉️ ${escapeHtml(post.email)} &nbsp;|&nbsp;
              📅 ${new Date(post.submittedAt).toLocaleDateString('en-PK', 
                  { day:'numeric', month:'short', year:'numeric' })}
              &nbsp;|&nbsp;
              📝 ${post.wordCount} words
            </p>
          </div>
          <span class="text-xs font-bold px-3 py-1 rounded-full ${
            post.status === 'pending'  
              ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-300' :
            post.status === 'approved' 
              ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300' :
              'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300'
          }">
            ${post.status.toUpperCase()}
          </span>
        </div>

        <!-- Collapsible Content -->
        <details class="mt-3">
          <summary class="cursor-pointer text-sm font-semibold 
                          text-[var(--accent)] hover:opacity-80">
            📖 Read Full Article
          </summary>
          <div style="
            margin-top: 12px;
            padding: 16px;
            background: #1a1a2e;
            color: #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #374151;
            font-family: inherit;
          ">
            ${escapeHtml(post.content)}
          </div>
        </details>

        <!-- Action Buttons (only for pending) -->
        ${post.status === 'pending' ? `
          <div class="flex gap-3 mt-4">
            <button onclick="updatePostStatus('${post.id}', 'approved')"
              class="flex-1 py-2 px-4 bg-green-500 hover:bg-green-600 
                     text-white font-bold rounded-lg text-sm transition-colors">
              ✅ Approve
            </button>
            <button onclick="updatePostStatus('${post.id}', 'rejected')"
              class="flex-1 py-2 px-4 bg-red-500 hover:bg-red-600 
                     text-white font-bold rounded-lg text-sm transition-colors">
              ❌ Reject
            </button>
          </div>
        ` : post.reviewedAt ? `
          <p class="text-xs text-gray-400 mt-3">
            Reviewed on: ${new Date(post.reviewedAt).toLocaleDateString('en-PK', 
            { day:'numeric', month:'short', year:'numeric' })}
          </p>
        ` : ''}

      </div>
    `).join('');
  }

  // ── Update Status (Approve / Reject) ──────────────────────────
  async function updatePostStatus(id, status) {
    const adminKey = localStorage.getItem('adminKey');
    if (!adminKey) return;

    const label = status === 'approved' ? 'Approve' : 'Reject';
    if (!confirm(`Are you sure you want to ${label} this post?`)) return;

    try {
      const res = await fetch('/api/guest-posts', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${adminKey}`
        },
        body: JSON.stringify({ id, status })
      });

      if (res.ok) {
        // Update local data and re-render
        allGuestPosts = allGuestPosts.map(p =>
          p.id === id
            ? { ...p, status, reviewedAt: new Date().toISOString() }
            : p
        );
        renderPosts(currentFilter);
      } else {
        alert('Failed to update post status. Please try again.');
      }
    } catch (err) {
      alert('Network error. Please check your connection.');
    }
  }

  // ── XSS Protection ────────────────────────────────────────────
  function escapeHtml(str) {
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Auto-load on page ready
  document.addEventListener('DOMContentLoaded', loadGuestPosts);
</script>
</body>
</html>
