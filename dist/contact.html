<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Intextify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { padding: 2rem; max-width: 800px; margin: 0 auto; }
        .contact-form { display: flex; flex-direction: column; gap: 1rem; }
        textarea { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 1rem; border-radius: 6px; font-family: inherit; font-size: var(--text-md); resize: vertical; min-height: 150px; outline: none; transition: 0.2s; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
        h1 { color: var(--accent); }
    </style>
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="nttKcMMSvpiE9XgFKECdY4J80taaKOKwkm0oxHekwjQ" />
    <!-- Google Analytics Tracking -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XTMXVQ4QKE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XTMXVQ4QKE');
    </script>
  <link rel="stylesheet" crossorigin href="/assets/styles-DfvIQkLm.css">
</head>
<body>
    <div class="panel">
        <div class="panel-header">
            <h1>Contact Us</h1>
            <p>Get in touch for feedback, business queries, or advertisement placements.</p>
        </div>
        <div class="p-8">
            <form class="contact-form" onsubmit="event.preventDefault(); alert('We have received your message! Expect a reply soon.');">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="action-btn primary-btn">Send Message</button>
            </form>
            
            <a href="index.html" class="action-btn inline-block mt-8 max-w-[200px] text-center">&larr; Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
